<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SoundSnap — Guess the song</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#111;--s2:#181818;--s3:#202020;
  --border:#252525;--b2:#303030;
  --green:#1db954;--green2:#145e2d;
  --text:#f0f0f0;--t2:#999;--t3:#555;
  --red:#e74c3c;--yellow:#f39c12;--blue:#3498db;--purple:#9b59b6;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
.shell{max-width:660px;margin:0 auto;padding:0 18px 40px}
/* Header */
header{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo span{color:var(--green)}
.hstats{display:flex;gap:18px}
.hstat{text-align:center}
.hstat-n{font-size:18px;font-weight:600;font-family:'Space Grotesk',sans-serif}
.hstat-l{font-size:10px;color:var(--t3);letter-spacing:.05em;margin-top:1px}
/* Filters row */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-row select{flex:1;min-width:120px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--t2);padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer}
.filter-row select:focus{outline:none;border-color:var(--green)}
/* Difficulty pills */
.diff-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.diff-pill{flex:1;min-width:70px;padding:7px 6px;border-radius:20px;border:1px solid var(--b2);background:transparent;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;text-align:center;color:var(--t3)}
.diff-pill:hover{color:var(--t2)}
.diff-pill[data-d="easy"].active{background:#1db95420;border-color:#1db95460;color:var(--green)}
.diff-pill[data-d="medium"].active{background:#f39c1220;border-color:#f39c1260;color:var(--yellow)}
.diff-pill[data-d="hard"].active{background:#e74c3c20;border-color:#e74c3c60;color:var(--red)}
.diff-pill[data-d="expert"].active{background:#9b59b620;border-color:#9b59b660;color:var(--purple)}
.diff-pill[data-d="impossible"].active{background:#e74c3c30;border-color:#e74c3c80;color:#ff6b6b}
/* Diff hint */
.diff-hint{font-size:11px;color:var(--t3);margin-bottom:14px;padding:0 2px}
/* Player */
.player{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.clip-row{display:flex;gap:5px;margin-bottom:16px}
.cp{flex:1;padding:6px 0;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;font-family:'Inter',sans-serif;cursor:default;transition:all .15s;text-align:center}
.cp.on{color:var(--t2);cursor:pointer}
.cp.cur{background:var(--green);border-color:var(--green);color:#000;font-weight:600}
.cp.done{border-color:var(--border);color:var(--t3);background:var(--s2)}
/* Waveform */
.wf{display:flex;align-items:center;gap:2px;height:52px;margin-bottom:16px;cursor:pointer}
.wb{flex:1;border-radius:2px;background:var(--s3);transition:background .04s}
.wb.p{background:#1db95455}
.wb.a{background:var(--green)}
/* Play row */
.play-row{display:flex;align-items:center;gap:14px}
.pbtn{width:52px;height:52px;border-radius:50%;background:var(--green);border:none;color:#000;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,background .1s}
.pbtn:hover{background:#1ed760;transform:scale(1.04)}
.pbtn:active{transform:scale(.96)}
.tinfo{display:flex;flex-direction:column;gap:2px}
.tcur{font-size:20px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--green)}
.ttot{font-size:11px;color:var(--t3)}
/* Guesses */
.glist{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.gi{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;font-size:13px}
.gi.wr{background:#e74c3c12;border:1px solid #e74c3c30;color:var(--red)}
.gi.sk{background:var(--s2);border:1px solid var(--border);color:var(--t3)}
/* Search */
.sw{position:relative;margin-bottom:9px}
.si{width:100%;padding:11px 14px 11px 40px;background:var(--s2);border:1px solid var(--b2);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:border-color .15s}
.si:focus{outline:none;border-color:var(--green)}
.sico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:15px;pointer-events:none}
.sdrop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s2);border:1px solid var(--b2);border-radius:10px;overflow:hidden;z-index:20;max-height:210px;overflow-y:auto;box-shadow:0 8px 24px #0008}
.sdi{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.sdi:last-child{border-bottom:none}
.sdi:hover{background:var(--s3)}
.sdi-t{font-size:13px;font-weight:500;color:var(--text)}
.sdi-m{font-size:11px;color:var(--t3);margin-top:1px}
/* Action row */
.arow{display:flex;gap:8px}
.bskip{flex:1;padding:10px;background:transparent;border:1px solid var(--b2);border-radius:9px;color:var(--t2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.bskip:hover{border-color:var(--t3);color:var(--text)}
.bguess{flex:2;padding:10px;background:var(--green);border:none;border-radius:9px;color:#000;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.bguess:hover{background:#1ed760}
/* Result */
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center}
.rico{font-size:38px;margin-bottom:10px}
.rsong{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin-bottom:3px}
.rart{font-size:13px;color:var(--t2);margin-bottom:14px}
.rbadges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.rb{padding:4px 11px;border-radius:20px;font-size:11px;border:1px solid}
.rb-g{background:#1db95415;border-color:#1db95445;color:var(--green)}
.rb-r{background:#e74c3c15;border-color:#e74c3c45;color:var(--red)}
.rb-n{background:var(--s2);border-color:var(--b2);color:var(--t2)}
.ract{display:flex;gap:8px;justify-content:center}
.byt{padding:9px 16px;background:transparent;border:1px solid var(--b2);border-radius:8px;color:var(--t2);font-size:13px;text-decoration:none;font-family:'Inter',sans-serif;transition:all .15s}
.byt:hover{border-color:var(--t3);color:var(--text)}
.bnext{padding:9px 20px;background:var(--green);border:none;border-radius:8px;color:#000;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.bnext:hover{background:#1ed760}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">Sound<span>Snap</span></div>
    <div class="hstats">
      <div class="hstat"><div class="hstat-n" id="sc">0</div><div class="hstat-l">correct</div></div>
      <div class="hstat"><div class="hstat-n" id="ss">0</div><div class="hstat-l">streak</div></div>
      <div class="hstat"><div class="hstat-n" id="sp">0</div><div class="hstat-l">played</div></div>
    </div>
  </header>

  <!-- Filters -->
  <div class="filter-row">
    <select id="sel-era">
      <option value="any">All eras</option>
      <option value="pre60">Classic (pre-1960s)</option>
      <option value="60s">1960s</option>
      <option value="70s">1970s</option>
      <option value="80s">1980s</option>
      <option value="90s">1990s</option>
      <option value="2000s">2000s</option>
      <option value="2010s">2010s</option>
      <option value="2020s">2020s</option>
    </select>
    <select id="sel-genre">
      <option value="any">All genres</option>
      <option value="pop">Pop</option>
      <option value="hiphop">Hip-hop / Rap</option>
      <option value="rnb">R&amp;B / Soul</option>
      <option value="rock">Rock</option>
      <option value="alt">Alternative / Indie</option>
      <option value="metal">Metal</option>
      <option value="punk">Punk</option>
      <option value="country">Country</option>
      <option value="folk">Folk / Acoustic</option>
      <option value="jazz">Jazz</option>
      <option value="electronic">Electronic</option>
      <option value="edm">EDM</option>
      <option value="house">House / Techno</option>
      <option value="disco">Disco / Funk</option>
      <option value="reggae">Reggae</option>
      <option value="latin">Latin</option>
      <option value="kpop">K-pop</option>
    </select>
  </div>

  <!-- Difficulty -->
  <div class="diff-row" id="diff-row">
    <button class="diff-pill active" data-d="easy">Easy</button>
    <button class="diff-pill" data-d="medium">Medium</button>
    <button class="diff-pill" data-d="hard">Hard</button>
    <button class="diff-pill" data-d="expert">Expert</button>
    <button class="diff-pill" data-d="impossible">Impossible</button>
  </div>
  <div class="diff-hint" id="diff-hint"></div>

  <!-- Player -->
  <div class="player">
    <div class="clip-row" id="clip-row"></div>
    <div class="wf" id="wf" role="img" aria-label="Audio waveform"></div>
    <div class="play-row">
      <button class="pbtn" id="pbtn" aria-label="Play or pause clip">&#9654;</button>
      <div class="tinfo">
        <div class="tcur" id="tcur">0.0s</div>
        <div class="ttot" id="ttot">of 0.1s</div>
      </div>
    </div>
  </div>

  <div class="glist" id="glist"></div>

  <div id="game-area">
    <div class="sw">
      <span class="sico">&#128269;</span>
      <input class="si" id="ginput" placeholder="Name that track..." autocomplete="off"/>
      <div class="sdrop" id="sdrop" style="display:none"></div>
    </div>
    <div class="arow">
      <button class="bskip" id="bskip">Skip</button>
      <button class="bguess" id="bguess">Guess</button>
    </div>
  </div>

  <div id="result-area" style="display:none"></div>
</div>

// ── State ──────────────────────────────────────────────────────
let selEra='any', selGenre='any', selDiff='easy';
let curSong=null, clipIdx=0, guesses=[], isPlaying=false;
let waveAnim=null, playTO=null, tickTO=null;
let stats={c:0,s:0,p:0};
let used=new Set();

function getClips(){ return DIFFS[selDiff].clips; }

function getPool(){
  const diff=selDiff;
  return DB.filter(s=>{
    const eOk=selEra==='any'||s.e===selEra;
    const gOk=selGenre==='any'||s.g.includes(selGenre);
    if(!eOk||!gOk)return false;
    if(diff==='easy')return s.pop>=5;
    if(diff==='medium')return s.pop>=4;
    if(diff==='hard')return s.pop>=3;
    if(diff==='expert')return s.pop>=2;
    return true; // impossible — all songs
  });
}

function pick(){
  const pool=getPool();
  const src=pool.length?pool:DB;
  const avail=src.filter(s=>!used.has(s.t+'|'+s.a));
  const from=avail.length?avail:src;
  // Shuffle weighted — further from used = more likely
  return from[Math.floor(Math.random()*from.length)];
}

// ── UI Builders ────────────────────────────────────────────────
function buildWave(){
  const wf=document.getElementById('wf');
  wf.innerHTML='';
  for(let i=0;i<64;i++){
    const b=document.createElement('div');
    b.className='wb';
    b.style.height=(8+Math.random()*84)+'%';
    wf.appendChild(b);
  }
}

function buildClips(){
  const row=document.getElementById('clip-row');
  row.innerHTML='';
  getClips().forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='cp'+(i===0?' on cur':'');
    b.textContent=s+'s';
    b.setAttribute('aria-label',s+' second clip');
    b.onclick=()=>{if(i<=clipIdx){clipIdx=i;updateClips();playClip();}};
    row.appendChild(b);
  });
}

function updateClips(){
  const clips=getClips();
  document.querySelectorAll('.cp').forEach((b,i)=>{
    b.className='cp'+(i<clipIdx?' on done':i===clipIdx?' on cur':'');
  });
  document.getElementById('tcur').textContent='0.0s';
  document.getElementById('ttot').textContent='of '+clips[clipIdx]+'s';
}

function stopPlay(){
  clearInterval(waveAnim);clearTimeout(playTO);clearTimeout(tickTO);
  isPlaying=false;
  document.getElementById('pbtn').innerHTML='&#9654;';
  document.querySelectorAll('.wb').forEach(b=>b.classList.remove('p','a'));
}

function playClip(){
  if(!curSong)return;
  if(isPlaying){stopPlay();return;}
  const dur=getClips()[clipIdx];
  isPlaying=true;
  document.getElementById('pbtn').innerHTML='&#9646;&#9646;';
  const bars=document.querySelectorAll('.wb');
  const n=bars.length;
  let elapsed=0;
  bars.forEach(b=>b.classList.remove('p','a'));
  waveAnim=setInterval(()=>{
    elapsed+=50;
    const prog=Math.min(elapsed/(dur*1000),1);
    const idx=Math.floor(prog*n);
    bars.forEach((b,i)=>{b.classList.remove('p','a');if(i<idx)b.classList.add('p');else if(i===idx)b.classList.add('a');});
  },50);
  let t=0;
  const tick=()=>{t=Math.min(t+0.1,dur);document.getElementById('tcur').textContent=t.toFixed(1)+'s';if(t<dur)tickTO=setTimeout(tick,100);};
  tick();
  playTO=setTimeout(()=>{stopPlay();document.getElementById('tcur').textContent=dur+'s';},dur*1000);
}

function renderGuesses(){
  const l=document.getElementById('glist');
  l.innerHTML='';
  guesses.forEach(g=>{
    const d=document.createElement('div');
    d.className='gi '+(g.sk?'sk':'wr');
    d.textContent=g.sk?'— Skipped':'✗ '+g.text;
    l.appendChild(d);
  });
}

function buildSearch(){
  const inp=document.getElementById('ginput');
  const dd=document.getElementById('sdrop');
  inp.value='';dd.style.display='none';
  inp.oninput=()=>{
    const q=inp.value.toLowerCase().trim();
    if(!q){dd.style.display='none';return;}
    // Search all songs (not just pool) so you can guess anything
    const matches=DB.filter(s=>s.t.toLowerCase().includes(q)||s.a.toLowerCase().includes(q)).slice(0,9);
    if(!matches.length){dd.style.display='none';return;}
    dd.innerHTML='';dd.style.display='block';
    matches.forEach(s=>{
      const item=document.createElement('div');
      item.className='sdi';
      item.innerHTML=`<div class="sdi-t">${s.t}</div><div class="sdi-m">${s.a} &bull; ${s.y}</div>`;
      item.onclick=()=>{inp.value=s.t+' \u2014 '+s.a;dd.style.display='none';};
      dd.appendChild(item);
    });
  };
}

function skip(){
  guesses.push({sk:true});renderGuesses();
  const clips=getClips();
  if(clipIdx<clips.length-1){clipIdx++;updateClips();stopPlay();}
  else endGame(false);
  document.getElementById('ginput').value='';
  document.getElementById('sdrop').style.display='none';
}

function guess(){
  const val=document.getElementById('ginput').value.trim();
  if(!val)return;
  const won=val.toLowerCase().includes(curSong.t.toLowerCase())||
            curSong.t.toLowerCase().includes(val.toLowerCase().split('\u2014')[0].trim());
  if(won){endGame(true);}
  else{
    guesses.push({text:val,sk:false});renderGuesses();
    const clips=getClips();
    if(clipIdx<clips.length-1){clipIdx++;updateClips();stopPlay();}
    else endGame(false);
    document.getElementById('ginput').value='';
    document.getElementById('sdrop').style.display='none';
  }
}

function endGame(won){
  stopPlay();
  stats.p++;if(won){stats.c++;stats.s++;}else stats.s=0;
  document.getElementById('sc').textContent=stats.c;
  document.getElementById('ss').textContent=stats.s;
  document.getElementById('sp').textContent=stats.p;
  used.add(curSong.t+'|'+curSong.a);
  document.getElementById('game-area').style.display='none';
  const attempts=guesses.length+(won?1:0);
  const ra=document.getElementById('result-area');
  ra.style.display='block';
  ra.innerHTML=`<div class="rcard">
    <div class="rico">${won?'🎵':'😐'}</div>
    <div class="rsong">${curSong.t}</div>
    <div class="rart">${curSong.a} &bull; ${curSong.y}</div>
    <div class="rbadges">
      ${won?`<span class="rb rb-g">Got it in ${attempts} guess${attempts!==1?'es':''}</span>`:'<span class="rb rb-r">Missed this one</span>'}
      <span class="rb rb-n">Clip: ${getClips()[clipIdx]}s</span>
      <span class="rb rb-n">${selDiff}</span>
    </div>
    <div class="ract">
      <a class="byt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(curSong.t+' '+curSong.a)}" target="_blank" rel="noopener">Find on YouTube</a>
      <button class="bnext" onclick="startGame()">Next song</button>
    </div>
  </div>`;
}

function setDiff(d){
  selDiff=d;
  document.querySelectorAll('.diff-pill').forEach(b=>b.classList.toggle('active',b.dataset.d===d));
  document.getElementById('diff-hint').textContent=DIFFS[d].hint;
  used.clear();
  startGame();
}

function startGame(){
  curSong=pick();clipIdx=0;guesses=[];stopPlay();
  buildWave();buildClips();updateClips();renderGuesses();buildSearch();
  document.getElementById('game-area').style.display='block';
  document.getElementById('result-area').style.display='none';
}

// ── Event listeners ────────────────────────────────────────────
document.getElementById('sel-era').onchange=e=>{selEra=e.target.value;used.clear();startGame();};
document.getElementById('sel-genre').onchange=e=>{selGenre=e.target.value;used.clear();startGame();};
document.getElementById('diff-row').onclick=e=>{const p=e.target.closest('.diff-pill');if(p)setDiff(p.dataset.d);};
document.getElementById('pbtn').onclick=playClip;
document.getElementById('bskip').onclick=skip;
document.getElementById('bguess').onclick=guess;
document.getElementById('ginput').addEventListener('keydown',e=>{if(e.key==='Enter')guess();});
document.addEventListener('click',e=>{
  const dd=document.getElementById('sdrop');
  if(dd&&!dd.contains(e.target)&&e.target!==document.getElementById('ginput'))dd.style.display='none';
});

// ── Init ───────────────────────────────────────────────────────
setDiff('easy');
</script>
